<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Product preview card component</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main>
        <article class="productcard">
            <div class="productcard__content">
                <header class="productcard__header">
                    <div class="banner banner--product-1"></div>
                </header>
                <section class="productcard__body">
                    <p class="productcard__heading">Perfume</p>
                    <h2 class="productcard__title">Gabrielle Essence Eau De Parfum</h2>
                    <p class="productcard__text"> A floral, solar and voluptuous interpretation composed by Olivier
                        Polge,
                        Perfumer-Creator for the House of CHANEL.</p>
                    <div class="productcard__prices">
                        <p class="productcard__price">$149.99</p>
                        <p class="productcard__price__del">$169.99</p>
                    </div>
                    <button class="button">
                        <img src="images/icon-cart.svg" alt="Cart" class="icon"> 
                        Add to Cart
                    </button>
                </section>
            </div>
        </article>
    </main>

    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a target="_blank" href="https://github.com/RenatoDev124">Renato</a>.
    </footer>
</body>

</html>
